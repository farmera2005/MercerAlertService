# MercerAlertService on a Linux VM that can reach Orion on TCP 17774.
#
#   docker compose pull && docker compose up -d
#   then open http://<vm>:3000 and follow the setup wizard.
#
# The images are built and published by CI (ghcr.io/farmera2005/mercer-alert-service-*), so the VM
# downloads them and builds nothing. MAS_VERSION picks a tag (default: latest). To build from this
# checkout instead: docker compose build, then docker compose up -d.
#
# No .env file is needed: the `init` container generates the database password and the key that
# encrypts secrets saved in the web UI. A .env file is still honoured if present — any setting in it
# overrides (and locks) the matching field in the web UI. See .env.example.
#
# Test against the bundled fake Orion:  docker compose --profile dev up -d
# then in the wizard use base URL http://mock-swis:17774, user "mas", password "mas".
name: mercer-alert-service

x-images:
  # Published images; MAS_REGISTRY points elsewhere for a mirror or a private registry.
  worker: &worker-image ${MAS_REGISTRY:-ghcr.io/farmera2005}/mercer-alert-service-worker:${MAS_VERSION:-latest}

x-env-file: &env-file
  env_file:
    - path: .env
      required: false

x-app: &app
  <<: *env-file
  environment:
    DATABASE_URL_FILE: /bootstrap/database_url
    MAS_MASTER_KEY_FILE: /bootstrap/master_key
    TZ: ${APP_TIMEZONE:-America/New_York}
  volumes:
    - bootstrap:/bootstrap:ro
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '5' }
  # The images run as the unprivileged `node` user and need no Linux capabilities.
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  init:
    # Generates bootstrap secrets once (never overwrites). Runs as root only to set file ownership.
    build: &build
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      args: { APP_VERSION: '${APP_VERSION:-dev}' }
      secrets: [build_ca]
    image: *worker-image
    user: root
    command: ['node', 'dist/init.js']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mas}
      POSTGRES_DB: ${POSTGRES_DB:-mas}
      # Optional: pin the DB password instead of generating one (first start only).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - bootstrap:/bootstrap
    restart: 'no'

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mas}
      POSTGRES_USER: ${POSTGRES_USER:-mas}
      POSTGRES_PASSWORD_FILE: /bootstrap/postgres_password
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - bootstrap:/bootstrap:ro
    ports:
      # Localhost-only, for psql on the VM. Remove if not needed.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mas} -d ${POSTGRES_DB:-mas}']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    depends_on:
      init: { condition: service_completed_successfully }

  migrate:
    <<: *app
    image: *worker-image
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    depends_on:
      db: { condition: service_healthy }

  worker:
    <<: *app
    image: *worker-image
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Healthcheck (GET :9090/healthz) is defined in the image.
    stop_grace_period: 30s

  web:
    <<: *app
    build: { <<: *build, target: web }
    image: ${MAS_REGISTRY:-ghcr.io/farmera2005}/mercer-alert-service-web:${MAS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-mas}
      PGUSER: ${POSTGRES_USER:-mas}
      PGPASSWORD_FILE: /bootstrap/postgres_password
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${APP_TIMEZONE:-America/New_York}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - bootstrap:/bootstrap:ro
    depends_on:
      db: { condition: service_healthy }

  mock-swis:
    profiles: [dev]
    build: { <<: *build, target: mock-swis }
    image: ${MAS_REGISTRY:-ghcr.io/farmera2005}/mercer-alert-service-mock-swis:${MAS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:17774:17774'

volumes:
  pgdata:
  # Generated bootstrap secrets (DB password, DATABASE_URL, master key). Back this up with the dumps:
  # without master_key, secrets saved in the web UI cannot be decrypted after a restore.
  bootstrap:

secrets:
  # Only used at build time; see docker/Dockerfile. Defaults to an empty placeholder.
  build_ca:
    file: ${BUILD_CA_FILE:-./docker/no-extra-ca.pem}

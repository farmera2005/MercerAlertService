name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mas
          POSTGRES_PASSWORD: mas
          POSTGRES_DB: mas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mas -d mas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://mas:mas@localhost:5432/mas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Migrations are up to date with the schema
        run: |
          pnpm --filter @mercer/db exec drizzle-kit generate --name ci-check
          git diff --exit-code -- packages/db/migrations || (echo "::error::Schema changed without a migration — run pnpm db:generate" && exit 1)
      - run: pnpm build
        env:
          DATABASE_URL: postgres://unused

  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          for t in worker web mock-swis; do
            docker buildx build -f docker/Dockerfile --target "$t" -t "mas-$t:ci" --load .
          done

name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

# Public repository: the workflow only reads the code; pull requests from forks get no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mas
          POSTGRES_PASSWORD: mas
          POSTGRES_DB: mas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mas -d mas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://mas:mas@localhost:5432/mas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Migrations are up to date with the schema
        run: |
          pnpm --filter @mercer/db exec drizzle-kit generate --name ci-check
          git diff --exit-code -- packages/db/migrations || (echo "::error::Schema changed without a migration — run pnpm db:generate" && exit 1)
      - run: pnpm build
        env:
          DATABASE_URL: postgres://unused

  docker-e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build images and start a fresh stack (no .env)
        run: docker compose --profile dev up -d --build --wait --wait-timeout 300
      - name: Install Chromium
        run: pnpm --filter @mercer/web exec playwright install --with-deps chromium
      - name: Setup wizard end-to-end
        run: |
          export E2E_SETUP_CODE=$(docker compose logs web | grep -o '"setupCode":"[^"]*"' | tail -1 | cut -d'"' -f4)
          test -n "$E2E_SETUP_CODE"
          pnpm test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose --profile dev logs --tail 200
